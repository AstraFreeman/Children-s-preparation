<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Історична гра</title>
    <style>
        :root {
            --bg-color: #dceefb;
            --text-color: #093a85;
            --accent-color: #1a73e8;
            --card-bg: #f0f8ff;
            --card-shadow: rgba(0, 64, 128, 0.2);
            --correct-bg: #b0e0e6;
            --incorrect-bg: #ffccd5;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-image: url('Crstm_SB_2.jpg'); /* Замінити на реальне посилання на новорічний фон */
            background-size: cover;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            background-color: var(--card-bg);
            box-shadow: 0 4px 8px var(--card-shadow);
            border-radius: 10px;
            overflow: hidden;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .question {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            background: rgba(240, 248, 255, 0.9);
        }

        .image-placeholder img {
            border-radius: 8px;
            max-width: 100%;
        }

        .password-block {
            margin-top: 20px;
            padding: 10px;
            border: 2px solid var(--accent-color);
            border-radius: 5px;
            background-color: #87cefa;
            display: none;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            margin: 5px;
            font-family: 'Arial', sans-serif;
            font-size: 1rem;
        }

        button:hover {
            background-color: #005cbf;
        }

        button.selected {
            background-color: #003c8f;
            color: white;
        }

        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Історична гра: Зимова версія</h1>

        <div class="question" id="question1">
            <p><strong>Коли на Лівобережжя було поширено кріпацтво?</strong></p>
            <input type="text" id="answer1" placeholder="Введіть дату (кін XVIII ст.)">
        </div>

        <div class="question" id="question2">
            <p><strong>Що було одним із результатів Другого поділу Речі Посполитої (1793 р.)?</strong></p>
            <div class="option-buttons">
                <button onclick="selectAnswer(this, 'wrong')">Розгортання гайдамацького повстанського руху</button>
                <button onclick="selectAnswer(this, 'wrong')">Придушення опришківського руху</button>
                <button onclick="selectAnswer(this, 'correct')">Уключення Київщини до Російської імперії</button>
            </div>
        </div>

        <div class="question" id="question3">
            <p><strong>Яку пам’ятку архітектури України зображено на фото?</strong></p>
            <div class="image-placeholder">
                <img src="Crstm_SI_1_5.jpg" alt="Ілюстрація">
            </div>
            <div class="option-buttons">
                <button onclick="selectAnswer(this, 'correct')">Палац К. Розумовського</button>
                <button onclick="selectAnswer(this, 'wrong')">Георгіївська церква</button>
                <button onclick="selectAnswer(this, 'wrong')">Хотинська фортеця</button>
            </div>
        </div>

        <button onclick="checkAnswers()">Перевірити відповіді</button>

        <div class="password-block" id="passwordBlock">
            <p>Пароль для наступного рівня: <strong id="password"></strong></p>
        </div>

        <footer>
            © 2024 Історична гра. Усі права захищені.
        </footer>
    </div>

    <script>
        let correctAnswers = 0;
        const totalQuestions = 3;

        function selectAnswer(button, correctness) {
            const buttons = button.parentElement.querySelectorAll('button');
            buttons.forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');

            if (correctness === 'correct') {
                button.dataset.selected = 'true';
            } else {
                button.dataset.selected = 'false';
            }
        }

        function checkAnswers() {
            correctAnswers = 0;

            // Check first question
            const answer1 = document.getElementById('answer1').value.trim();
            if (answer1 === '1783') {
                correctAnswers++;
            }

            // Check selected answers
            const buttons = document.querySelectorAll('.option-buttons button.selected');
            buttons.forEach(button => {
                if (button.dataset.selected === 'true') {
                    correctAnswers++;
                }
            });

            if (correctAnswers === totalQuestions) {
                document.getElementById('password').textContent = 'Самар';
                document.getElementById('passwordBlock').style.display = 'block';
            } else {
                alert(`Ви відповіли правильно на ${correctAnswers} із ${totalQuestions} питань. Спробуйте ще раз!`);
            }
        }
    </script>
</body>
</html>
